services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recallhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Aa123456}
      POSTGRES_DB: ${POSTGRES_DB:-recallhub_db}
      N8N_DB_USER: ${N8N_DB_USER:-n8n}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-Aa123456}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "15432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ../api
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-recallhub}:${POSTGRES_PASSWORD:-Aa123456}@postgres:5432/${POSTGRES_DB:-recallhub_db}
      REDIS_URL: redis://redis:6379
      N8N_INTERNAL_BASE_URL: http://n8n:5678/webhook
      N8N_CALLBACK_URL: http://api:3000/api/v1/integrations/n8n/callback
      N8N_TRIGGER_SECRET: ${N8N_TRIGGER_SECRET:-change_me_trigger_secret}
      N8N_CALLBACK_SECRET: ${N8N_CALLBACK_SECRET:-change_me_callback_secret}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change_me_jwt_secret}
      APP_API_KEY: ${APP_API_KEY:-change_me_app_api_key}
      APP_API_KEY_ROLES: ${APP_API_KEY_ROLES:-admin,ops,user}
      ALLOWED_REPO_ROOTS: ${ALLOWED_REPO_ROOTS:-/workspace/repos}
    volumes:
      - ../repos:/workspace/repos:ro
    ports:
      - "3000:3000"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    depends_on:
      - postgres
      - redis
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n_db}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-Aa123456}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change_me_32_chars_minimum_local}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_CALLBACK_URL: http://api:3000/api/v1/integrations/n8n/callback
      N8N_CALLBACK_SECRET: ${N8N_CALLBACK_SECRET:-change_me_callback_secret}
      N8N_TRIGGER_SECRET: ${N8N_TRIGGER_SECRET:-change_me_trigger_secret}
      N8N_LLM_MODE: ${N8N_LLM_MODE:-contract_stub}
      N8N_LLM_MODEL: ${N8N_LLM_MODEL:-}
      N8N_LLM_TIMEOUT_MS: ${N8N_LLM_TIMEOUT_MS:-60000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: false
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      GENERIC_TIMEZONE: Asia/Tehran
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows/stubs:/workflows/stubs:ro
    ports:
      - "5678:5678"

  n8n-import:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles:
      - tools
    depends_on:
      - postgres
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n_db}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-Aa123456}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change_me_32_chars_minimum_local}
      N8N_CALLBACK_URL: http://api:3000/api/v1/integrations/n8n/callback
      N8N_CALLBACK_SECRET: ${N8N_CALLBACK_SECRET:-change_me_callback_secret}
      N8N_TRIGGER_SECRET: ${N8N_TRIGGER_SECRET:-change_me_trigger_secret}
      N8N_LLM_MODE: ${N8N_LLM_MODE:-contract_stub}
      N8N_LLM_MODEL: ${N8N_LLM_MODEL:-}
      N8N_LLM_TIMEOUT_MS: ${N8N_LLM_TIMEOUT_MS:-60000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: false
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows/stubs:/workflows/stubs:ro
    command: ["import:workflow", "--separate", "--input=/workflows/stubs"]

  web:
    build:
      context: ../web
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  postgres_data:
  n8n_data:
